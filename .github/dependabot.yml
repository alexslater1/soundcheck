# Dependabot: weekly, grouped minor/patch updates per ecosystem to keep PR noise low.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      expo:
        patterns: ['expo*', '@expo/*', 'react-native*']
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    groups:
      cdk:
        patterns: ['aws-cdk*', 'cdk-nag', 'constructs']
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /lab
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
