# CI: path-filtered jobs so a docs-only change doesn't boot Testcontainers.
# Every job runs on pushes to main; on pull requests only the jobs whose paths changed run
# (skipped jobs count as passing for required checks).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's changed files
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      lab: ${{ steps.filter.outputs.lab }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/openapi.json'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'contracts/openapi.json'
              - '.github/workflows/ci.yml'
            lab:
              - 'lab/**'
              - 'contracts/ranking/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: "${{ github.ref != 'refs/heads/main' }}"
      - name: "Build, codegen and test (Testcontainers: PostGIS + LocalStack)"
        working-directory: backend
        run: ./gradlew spotlessCheck build --no-daemon --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test

  app:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        env:
          CI: '1'
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          CI: '1'
      - name: Generated client matches contracts/openapi.json (orval drift)
        run: |
          npx orval
          git diff --exit-code --stat -- src/api/generated
      - name: Web export builds
        run: npx expo export -p web
        env:
          CI: '1'

  lab:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5.2.2
        with:
          version: "0.5.30"
          enable-cache: true
          cache-dependency-glob: lab/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  infra:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        env:
          CI: '1'
      - run: npm run build
      - run: npm test
        env:
          CI: '1'
      - name: Synth offline (placeholder account, cdk-nag as validation plugin)
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: eu-west-2
