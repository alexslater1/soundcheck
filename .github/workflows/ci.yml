# CI: path-filtered jobs so a docs-only change doesn't boot Testcontainers.
# Every job runs on pushes to main; on pull requests only the jobs whose paths changed run
# (skipped jobs count as passing for required checks).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's changed files
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      lab: ${{ steps.filter.outputs.lab }}
      infra: ${{ steps.filter.outputs.infra }}
      e2e: ${{ steps.filter.outputs.e2e }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/openapi.json'
              - 'contracts/ranking/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'contracts/openapi.json'
              - '.github/workflows/ci.yml'
            lab:
              - 'lab/**'
              - 'contracts/ranking/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'ops/aws/**'
              - 'ops/scripts/check-media-delivery.sh'
              - 'ops/scripts/smoke.sh'
              # read by ops/aws/test/contract-check.sh
              - 'backend/src/main/resources/application*.yaml'
              - '.github/workflows/ci.yml'
            e2e:
              - 'backend/**'
              - 'app/**'
              - 'contracts/openapi.json'
              - 'compose.yaml'
              - 'ops/caddy/**'
              - 'ops/localstack/**'
              - 'ops/ci/**'
              - 'ops/scripts/make_clips.py'
              - '.github/workflows/ci.yml'
            images:
              - 'backend/Dockerfile.*'
              - 'backend/build.gradle.kts'
              - 'backend/gradle/**'
              - 'lab/Dockerfile'
              - 'lab/pyproject.toml'
              - 'lab/uv.lock'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: "${{ github.ref != 'refs/heads/main' }}"
      # The media pipeline tests run the real ffmpeg/ffprobe; the runner image has neither.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: "Build, codegen and test (Testcontainers: PostGIS + LocalStack; FFmpeg)"
        working-directory: backend
        run: ./gradlew spotlessCheck build --no-daemon --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test

  app:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        env:
          CI: '1'
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          CI: '1'
      - name: Generated client matches contracts/openapi.json (orval drift)
        run: |
          npx orval
          git diff --exit-code --stat -- src/api/generated
      - name: Web export builds
        run: npx expo export -p web
        env:
          CI: '1'

  lab:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: lab/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # pytest includes the parity cases and the metric cases (contracts/ranking/)
      - run: uv run pytest -q
      - name: Parity with the Java scorer
        run: uv run soundcheck-lab parity

  infra:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      # shellcheck and the dry run of the make aws-* scripts against recorded outputs.
      # No credentials and no AWS calls; the runner has shellcheck and jq.
      - name: Deploy scripts (shellcheck, offline dry run)
        working-directory: .
        run: ops/aws/test/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        env:
          CI: '1'
      - run: npm run build
      - run: npm test
        env:
          CI: '1'
      - name: Synth offline (placeholder account, cdk-nag as validation plugin)
        run: npx cdk synth --quiet -c imageTag=ci
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: eu-north-1
      # Every task definition's variables and secrets against what the backend reads.
      - name: Task definitions match the backend's properties (contract check)
        working-directory: .
        run: ops/aws/test/contract-check.sh

  # Container images: the jar as `make images` builds it, then the three images, not pushed.
  # A broken Dockerfile shows up here rather than at a deploy. Each Java image must start as uid 10001 on
  # a read-only root with only /tmp writable, as ECS runs it.
  images:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build the jar (jOOQ codegen runs against a Testcontainers PostGIS)
        working-directory: backend
        run: ./gradlew bootJar --no-daemon --console=plain
      - name: Build the api, worker and lab images (linux/amd64)
        run: |
          jar=$(ls backend/build/libs/*.jar | grep -v -- '-plain.jar$')
          mkdir -p backend/build/docker && cp "$jar" backend/build/docker/app.jar
          for image in api worker; do
            docker build --platform linux/amd64 -f backend/Dockerfile.$image -t soundcheck-$image:ci backend/build/docker
          done
          docker build --platform linux/amd64 -f lab/Dockerfile -t soundcheck-lab:ci .
          docker image ls --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep -E '^soundcheck-(api|worker|lab):ci '
      - name: Non-root, read-only root, FFmpeg in the worker, the lab's parity check
        run: |
          for image in api worker; do
            uid=$(docker run --rm --read-only --tmpfs /tmp:uid=10001 --entrypoint id soundcheck-$image:ci -u)
            test "$uid" = 10001
          done
          docker run --rm --read-only --tmpfs /tmp:uid=10001 --entrypoint ffmpeg soundcheck-worker:ci -version | head -1
          docker run --rm --read-only --tmpfs /tmp:uid=10001 soundcheck-lab:ci parity

  # Web E2E: the Playwright journeys in app/e2e against the whole local stack on the
  # runner: PostGIS, LocalStack (S3 + SQS), the API and the transcode worker from the built jar, and the
  # Caddy edge serving the static `expo export -p web` build (ops/ci/compose.e2e.yaml). A fresh database
  # per run, so nothing needs pruning afterwards.
  e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILES: -f compose.yaml -f ops/ci/compose.e2e.yaml
      # A CI-only throwaway admin (like the ITs' admin@test.local): the API's bootstrap creates it and the
      # console journeys sign in with it. It exists only in this job's throwaway database.
      SOUNDCHECK_ADMIN_EMAIL: admin@ci.soundcheck.test
      SOUNDCHECK_ADMIN_PASSWORD: ci-only-throwaway-passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install FFmpeg (the worker transcodes; make_clips.py generates the synthetic clips)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Synthetic clips and a JWT signing key
        run: |
          python3 ops/scripts/make_clips.py
          make keys
      - name: Build the API jar (jOOQ codegen runs against a Testcontainers PostGIS)
        working-directory: backend
        run: ./gradlew bootJar --no-daemon --console=plain
      - name: Build the web app
        working-directory: app
        run: |
          npm ci
          npx expo export -p web
        env:
          CI: '1'
      - name: Start PostGIS, LocalStack and the edge
        run: docker compose $COMPOSE_FILES up -d --wait --wait-timeout 240 db localstack edge
      - name: Import the fixture gigs (as `make ingest INGESTION_MODE=fixtures`; onboarding needs artists)
        working-directory: backend
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-plain.jar$')
          SOUNDCHECK_ROLES=cli SERVER_PORT=8099 INGESTION_MODE=fixtures INGESTION_VENUES_ENABLED=false \
            java -Xmx1g -jar "$jar" --spring.profiles.active=local --soundcheck.ingestion.cli=ingest > ../ingest.log 2>&1
          docker compose exec -T db psql -U soundcheck -d soundcheck -c \
            "select source, status, stats->>'created' as created, stats->>'errors' as errors from ingestion.ingestion_run"
      - name: Start the API and the worker
        working-directory: backend
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-plain.jar$')
          # The local profile, as `make api` and `make worker` use (its auth rate limit allows a run's
          # sign-ups from one IP). Venue scraping is off: the journeys need no live data, and fixtures
          # ingestion is the default mode.
          export INGESTION_VENUES_ENABLED=false
          SOUNDCHECK_ROLES=api,scheduler nohup java -Xmx1g -jar "$jar" --spring.profiles.active=local > ../api.log 2>&1 &
          SOUNDCHECK_ROLES=worker SERVER_PORT=8090 nohup java -Xmx1g -jar "$jar" --spring.profiles.active=local > ../worker.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8088/api/v1/health >/dev/null && echo "API up through the edge after $((i * 2)) s" && break
            sleep 2
          done
          curl -sf http://localhost:8088/api/v1/health
          curl -sf -o /dev/null http://localhost:8088/ && echo "web export served by the edge"
      - name: Install Chromium for Playwright
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Playwright journeys
        working-directory: app
        run: npx playwright test
        env:
          CI: '1'
      - name: Upload logs and Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            ingest.log
            api.log
            worker.log
            app/test-results
          retention-days: 7
