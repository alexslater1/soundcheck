# CodeQL code scanning. Free only on public repositories: the job skips itself while the
# repo is private.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Compile backend for CodeQL (no tests; codegen needs Docker, available on the runner)
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: ./gradlew compileJava --no-daemon --console=plain
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
