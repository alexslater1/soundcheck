# gitleaks configuration (CI job `gitleaks`): the default rules plus one narrow, reviewed exception.
[extend]
useDefault = true

[allowlist]
# JwtKeys.toPem() wraps a key generated at runtime in PEM framing. The `private-key` rule matches the
# "-----BEGIN PRIVATE KEY-----" string literal in the Java source; no key material is ever committed
# (keys live in .secrets/, gitignored). Matching on the code expression keeps real PEM keys detectable.
#
# TicketmasterSourceTest uses an obviously fake key ("test-key-that-must-never-leak-…") to prove the
# client never leaks its key; the `generic-api-key` rule flags that literal. Only that exact literal is
# allowed, so any real key, in that file or elsewhere, is still caught.
#
# FcmCredentialsTest builds a key file around an RSA key generated during the test, with PEM
# framing as string literals; matched on that code expression, as for JwtKeys.
#
# ops/aws/test/dry-run.sh exports invented AWS credentials ("secret-SENTINEL-8888") so it can
# prove no dry run ever prints them; only that exact literal is allowed.
description = "JwtKeys.toPem() string literal; the fake key literal in TicketmasterSourceTest; FcmCredentialsTest's generated key; the dry-run test's sentinel AWS secret"
regexTarget = "match"
regexes = [
  '''encodeToString\(privateKey\.getEncoded\(\)\)''',
  '''test-key-that-must-never-leak-0123456789''',
  '''String\.join\("\\\\n", base64\.split''',
  '''secret-SENTINEL-8888''',
]

# Postgres EXPLAIN output in the perf run files has lines such as "Sort Key: p_2.published_at DESC", which
# `generic-api-key` reads as a key. Allowed only for that rule, only in docs/perf/runs/, baseline/ and final/ and only on a plan's
# key-label lines, so a real key anywhere else in a run file is still caught. (gitleaks 8.24 ignores a
# top-level [[allowlists]] next to [extend]; a rule-scoped allowlist on the default rule works.)
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "EXPLAIN plan key labels in perf run files"
condition = "AND"
paths = ['''^docs/perf/(runs|baseline|final)/''']
regexTarget = "line"
regexes = ['''^\s*(?:->\s*)?(?:Sort|Presorted|Group|Cache|Hash|Merge|Partition) Key: ''']
