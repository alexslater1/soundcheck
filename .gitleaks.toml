# gitleaks configuration (CI job `gitleaks`): the default rules plus one narrow, reviewed exception.
[extend]
useDefault = true

[allowlist]
# JwtKeys.toPem() wraps a key generated at runtime in PEM framing. The `private-key` rule matches the
# "-----BEGIN PRIVATE KEY-----" string literal in the Java source; no key material is ever committed
# (keys live in .secrets/, gitignored). Matching on the code expression keeps real PEM keys detectable.
#
# TicketmasterSourceTest uses an obviously fake key ("test-key-that-must-never-leak-…") to prove the
# client never leaks its key; the `generic-api-key` rule flags that literal. Only that exact literal is
# allowed, so any real key, in that file or elsewhere, is still caught.
description = "JwtKeys.toPem() string literal; the fake key literal in TicketmasterSourceTest"
regexTarget = "match"
regexes = [
  '''encodeToString\(privateKey\.getEncoded\(\)\)''',
  '''test-key-that-must-never-leak-0123456789''',
]
