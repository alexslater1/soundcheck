# Profile `local`: Gradle-run API/worker against the Docker Compose stack.
logging:
  level:
    app.soundcheck: debug
    org.jooq.tools.LoggerListener: debug

soundcheck:
  rate-limit:
    auth:
      # Locally every client has the same address (browser tabs, the phone through `adb reverse`, the
      # Playwright journeys with several accounts), and every page load makes one /auth/refresh call.
      # The specified 10 per minute per IP (application.yaml, used on AWS) is exhausted by a few reloads,
      # which shows as being signed out. The limit itself is tested in AuthRateLimitIT.
      per-ip-per-minute: ${AUTH_RATE_LIMIT_PER_IP:120}
  signals:
    # The affinity rollup runs every 10 minutes by default. Locally a minute, so that "like a few clips
    # of one artist, refresh, see that artist move up" can be shown without waiting.
    affinity-rollup-interval: ${AFFINITY_ROLLUP_INTERVAL:PT1M}
  ingestion:
    venues:
      # Locally every venue that passed the compliance gate is read (live mode only). Override
      # with INGESTION_VENUES_ENABLED=false or a shorter INGESTION_VENUE_SITES.
      enabled: ${INGESTION_VENUES_ENABLED:true}
      sites: ${INGESTION_VENUE_SITES:hope-and-anchor,amersham-arms,new-river-studios,moth-club}

