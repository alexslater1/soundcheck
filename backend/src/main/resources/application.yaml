# Base configuration. Every value that differs per environment comes from an environment variable
# (documented in .env.example) with a local-stack default, so `make api` works out of the box.
spring:
  application:
    name: soundcheck
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soundcheck}
    username: ${DB_USER:soundcheck}
    password: ${DB_PASSWORD:soundcheck}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway's own history table lives in public; module tables live in their schemas.
  jooq:
    sql-dialect: postgres
  modulith:
    events:
      # The outbox table is created by Flyway (V001) in schema `shared`, not by Modulith.
      jdbc:
        schema: shared
        schema-initialization:
          enabled: false
      completion-mode: archive
      republish-outstanding-events-on-restart: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  # Caddy (local) and the ALB (AWS) sit in front: take the client IP from X-Forwarded-For sent by
  # internal-network proxies only (Tomcat RemoteIpValve), so per-IP rate limits key on real clients.
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

soundcheck:
  # Comma-separated process roles: api, scheduler, worker. Locally one process may run all.
  roles: ${SOUNDCHECK_ROLES:api,scheduler,worker}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
  features: {}
  cors:
    # The Expo dev server and the local edge (SecurityConfig.LOCAL_DEV_ORIGINS); empty under the aws profile.
    allowed-origins: http://localhost:8081,http://localhost:8088
  storage:
    # Blank on AWS (task role, virtual-host style); LocalStack locally (static creds, path-style).
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:eu-west-2}
    bucket: ${S3_BUCKET:soundcheck-media}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  queue:
    url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/soundcheck-transcode}
    # Watched by the pipeline console, never read from. Blank turns the DLQ tile off.
    dlq-url: ${SQS_DLQ_URL:http://localhost:4566/000000000000/soundcheck-transcode-dlq}
  worker:
    # The transcode worker. One job at a time per 2 vCPUs: FFmpeg uses the cores.
    enabled: ${WORKER_ENABLED:true}
    concurrency: ${WORKER_CONCURRENCY:1}
    work-dir: ${WORKER_WORK_DIR:/tmp/soundcheck}
  media:
    # Where /media/* is served from: the Caddy edge locally, CloudFront on AWS.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
  auth:
    jwt:
      # PEM with PRIVATE KEY + PUBLIC KEY blocks (`make keys` → .secrets/jwt-es256.pem). Either wins over an ephemeral key.
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      private-key-path: ${JWT_PRIVATE_KEY_PATH:../.secrets/jwt-es256.pem}
      issuer: soundcheck
      audience: soundcheck-app
      access-ttl: 15m
      refresh-ttl: 30d
      # A rotated refresh token may be presented again this long after its rotation, if the token that
      # replaced it was never presented: the answer was lost on the way.
      refresh-grace: 60s
  push:
    # Push notifications through Firebase Cloud Messaging. Off until a Firebase project exists:
    # PUSH_ENABLED=true and its service account key (`docs/SETUP.md`, gitignored under .secrets/).
    enabled: ${PUSH_ENABLED:false}
    credentials-file: ${PUSH_CREDENTIALS_FILE:../.secrets/fcm-service-account.json}
  rate-limit:
    # Auth limits (Bucket4j, per API instance).
    auth:
      per-ip-per-minute: ${AUTH_RATE_LIMIT_PER_IP:10}
      per-email-per-minute: ${AUTH_RATE_LIMIT_PER_EMAIL:5}
    # POST /events: requests per user per minute.
    events-per-minute: ${EVENTS_RATE_LIMIT_PER_MINUTE:120}
  ingestion:
    # fixtures (recorded JSON under fixtures/, no network) or live (real APIs, needs the keys below).
    mode: ${INGESTION_MODE:fixtures}
    fixtures-dir: ${INGESTION_FIXTURES_DIR:../fixtures}
    horizon-days: ${INGESTION_HORIZON_DAYS:365}
    call-budget: ${INGESTION_CALL_BUDGET:1500}
    # Raw responses are kept this long (7 days); the gigs taken from them are kept for good.
    payload-retention: ${INGESTION_PAYLOAD_RETENTION:7d}
    # Refuse to mix the invented fixture gigs with real ones in one database (see IngestionGuard).
    allow-mixed-data: ${INGESTION_ALLOW_MIXED_DATA:false}
    enrichment:
      max-artists-per-run: ${INGESTION_ENRICH_MAX:300}
    ticketmaster:
      api-key: ${TICKETMASTER_API_KEY:}
    lastfm:
      api-key: ${LASTFM_API_KEY:}
    setlistfm:
      api-key: ${SETLISTFM_API_KEY:}
      # Store the past gigs of acts with clips (the SETLISTFM source). Off by default.
      backfill:
        enabled: ${INGESTION_SETLISTFM_BACKFILL:false}
    # Venues' own websites: off unless enabled, and only the listed registry keys.
    venues:
      enabled: ${INGESTION_VENUES_ENABLED:false}
      sites: ${INGESTION_VENUE_SITES:}
    musicbrainz:
      user-agent: ${MUSICBRAINZ_USER_AGENT:Soundcheck/0.1 (set MUSICBRAINZ_USER_AGENT)}
  admin:
    # Bootstrap ADMIN account created on API start when absent; blank email disables it.
    email: ${SOUNDCHECK_ADMIN_EMAIL:}
    password: ${SOUNDCHECK_ADMIN_PASSWORD:}
    # Accounts at these email domains are synthetic (seed and simulator personas); the console tags them.
    synthetic-email-domains: seed.soundcheck.test,sim.soundcheck.test

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: db,s3,sqs,readinessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.name: soundcheck
      deployment.environment: ${SOUNDCHECK_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    # Log events, bridged from Logback by OpenTelemetryLogAppender: to Loki locally.
    logging:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s

logging:
  structured:
    format:
      console: ecs
  level:
    root: info
    app.soundcheck: debug

springdoc:
  api-docs:
    path: /v3/api-docs
  # Responses are JSON unless a controller says otherwise; orval needs a concrete media type for zod schemas.
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**
