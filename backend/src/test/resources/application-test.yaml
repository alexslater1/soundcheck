# Test profile overrides (IntegrationTest is @ActiveProfiles("test"); plain unit tests don't load it).
logging:
  structured:
    format:
      console: ""
  level:
    app.soundcheck: info
    org.testcontainers: info
# The shared test context makes many auth calls from one IP; the limits themselves are tested in
# AuthRateLimitIT, which lowers these with @TestPropertySource (which outranks this file).
soundcheck:
  rate-limit:
    auth:
      per-ip-per-minute: 10000
      per-email-per-minute: 10000
  # Tests never call the real gig APIs, whatever INGESTION_MODE and the keys are in the developer's .env
  # (the Makefile exports .env into `make test` / `make verify`). The live clients are tested with WireMock.
  ingestion:
    mode: fixtures
    fixtures-dir: ../fixtures
    # The fixture's own dates (3–9 Oct 2026): tests that move the clock or run across midnight must not
    # see every fixture gig "change" because the shift moved by a day.
    fixtures-shift-to-today: false
    ticketmaster:
      api-key: ""
    lastfm:
      api-key: ""
