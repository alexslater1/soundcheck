# Test profile overrides (IntegrationTest is @ActiveProfiles("test"); plain unit tests don't load it).
logging:
  structured:
    format:
      console: ""
  level:
    app.soundcheck: info
    org.testcontainers: info
# The shared test context makes many auth calls from one IP; the limits themselves are tested in
# AuthRateLimitIT, which lowers these with @TestPropertySource (which outranks this file).
soundcheck:
  rate-limit:
    auth:
      per-ip-per-minute: 10000
      per-email-per-minute: 10000
