# Local stack mirroring the deployed shape:
#   Caddy plays CloudFront · LocalStack plays S3 + SQS · postgis plays RDS · otel-lgtm collects telemetry.
# `make up` starts db, localstack, lgtm, edge. The api/worker containers (profile `full`) are for
# running everything in Docker; day to day the API and worker run from Gradle (`make api`, `make worker`).
name: soundcheck

services:
  db:
    image: postgis/postgis:17-3.5
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - auto_explain.log_min_duration=50ms
      - -c
      - log_min_duration_statement=250ms
    environment:
      POSTGRES_DB: ${DB_NAME:-soundcheck}
      POSTGRES_USER: ${DB_USER:-soundcheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-soundcheck}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-soundcheck} -d ${DB_NAME:-soundcheck}"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.1.1
    environment:
      SERVICES: s3,sqs
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-2}
      # Legacy queue URLs (http://localhost:4566/000000000000/<name>) match SQS_QUEUE_URL in .env.example.
      SQS_ENDPOINT_STRATEGY: "off"
    ports:
      - "4566:4566"
    volumes:
      - ./ops/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # The init hook creates the bucket and queues; "ready" means every stage has run.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  lgtm:
    image: grafana/otel-lgtm:0.8.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./ops/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
      - ./ops/grafana/provisioning-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  edge:
    image: caddy:2.9-alpine
    ports:
      - "8088:8088"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/edge/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Optional: run the backend in containers too (`docker compose --profile full up`) ──
  # Images are defined in backend/Dockerfile.api and Dockerfile.worker.
  api:
    profiles: ["full"]
    build:
      context: backend
      dockerfile: Dockerfile.api
    environment:
      SOUNDCHECK_ROLES: api,scheduler
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-soundcheck}
      DB_USER: ${DB_USER:-soundcheck}
      DB_PASSWORD: ${DB_PASSWORD:-soundcheck}
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:-soundcheck-media}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/soundcheck-transcode
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: backend
      dockerfile: Dockerfile.worker
    environment:
      SOUNDCHECK_ROLES: worker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-soundcheck}
      DB_USER: ${DB_USER:-soundcheck}
      DB_PASSWORD: ${DB_PASSWORD:-soundcheck}
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:-soundcheck-media}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/soundcheck-transcode
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  db-data:
  localstack-data:
