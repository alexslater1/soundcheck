# Local stack mirroring the deployed shape:
#   Caddy plays CloudFront · LocalStack plays S3 + SQS · postgis plays RDS · otel-lgtm collects telemetry.
# `make up` starts db, localstack, lgtm, edge. The api/worker containers (profile `full`) are for
# running everything in Docker; day to day the API and worker run from Gradle (`make api`, `make worker`).
name: soundcheck

services:
  db:
    image: postgis/postgis:17-3.5
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - auto_explain.log_min_duration=50ms
      - -c
      - log_min_duration_statement=250ms
    environment:
      POSTGRES_DB: ${DB_NAME:-soundcheck}
      POSTGRES_USER: ${DB_USER:-soundcheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-soundcheck}
    # Every port is published on 127.0.0.1 only: nobody else on the
    # Wi-Fi reaches Postgres, LocalStack or Grafana. The phone still gets in through `adb reverse`,
    # over USB or wireless debugging.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-soundcheck} -d ${DB_NAME:-soundcheck}"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: s3,sqs
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-2}
      # Legacy queue URLs (http://localhost:4566/000000000000/<name>) match SQS_QUEUE_URL in .env.example.
      SQS_ENDPOINT_STRATEGY: "off"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./ops/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
      # LocalStack's free edition keeps nothing between runs, while the database keeps the posts:
      # `make down` copies the bucket here and the ready hook copies it back (20-restore-media.sh).
      - media-snapshot:/snapshot
    # LocalStack's S3 keeps a file handle open per upload (on a deleted temp file) and never closes it:
    # on 2025-06-03 the demo seeding's ~300 large uploads plus the worker's transcodes used up the
    # default 1,024 and every PutObject/UploadPart failed with "[Errno 24] Too many open files" until a
    # restart. A higher soft limit (the hard limit is already 524,288) puts that far out of reach.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # The init hook creates the bucket and queues; "ready" means every stage has run.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  lgtm:
    image: grafana/otel-lgtm:0.11.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./ops/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
      - ./ops/grafana/provisioning-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  edge:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      # The whole directory: the Caddyfile imports web-dev.caddy or web-static.caddy beside it.
      - ./ops/caddy:/etc/caddy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/edge/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Optional: run the backend in containers too (`docker compose --profile full up`) ──
  # The AWS images: `make images` first, which builds the jar the build context holds. Like on
  # ECS they run as uid 10001 on a read-only root with /tmp writable. Not run day to day, and not checked:
  # presigned URLs name http://localstack:4566, which only the containers resolve, so uploads from the app
  # on the host don't work this way. The checked container run is ops/ci/images-check.sh.
  api:
    profiles: ["full"]
    image: soundcheck-api:local
    build:
      context: backend/build/docker
      dockerfile: ../../Dockerfile.api
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    environment:
      SOUNDCHECK_ROLES: api,scheduler
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-soundcheck}
      DB_USER: ${DB_USER:-soundcheck}
      DB_PASSWORD: ${DB_PASSWORD:-soundcheck}
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:-soundcheck-media}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/soundcheck-transcode
      SQS_DLQ_URL: http://localstack:4566/000000000000/soundcheck-transcode-dlq
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    profiles: ["full"]
    image: soundcheck-worker:local
    build:
      context: backend/build/docker
      dockerfile: ../../Dockerfile.worker
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    environment:
      SOUNDCHECK_ROLES: worker
      # The API migrates; the worker never runs Flyway (as on ECS).
      SPRING_FLYWAY_ENABLED: "false"
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-soundcheck}
      DB_USER: ${DB_USER:-soundcheck}
      DB_PASSWORD: ${DB_PASSWORD:-soundcheck}
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:-soundcheck-media}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/soundcheck-transcode
      SQS_DLQ_URL: http://localstack:4566/000000000000/soundcheck-transcode-dlq
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  db-data:
  localstack-data:
  media-snapshot:
