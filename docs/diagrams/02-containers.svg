<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="One jar, two roles: the API service answers requests through CloudFront and an internal load balancer; transcode workers take jobs from SQS; video bytes go from the phone straight to S3." font-family="&#x27;Ubuntu Sans&#x27;, &#x27;DejaVu Sans&#x27;, sans-serif">
