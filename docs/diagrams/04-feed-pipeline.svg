<polyline points="1830,835.0 1864,835 1864,175 1830,175.0" fill="none" stroke="#6D28D9" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#h-accent)"/>
<rect x="40" y="80" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="64" y="147.24" font-size="32" font-weight="600" fill="#14121C">User context</text>
<text x="64" y="195.24" font-size="26" fill="#5E5B70">follows, genres, home,</text>
<text x="64" y="233.24" font-size="26" fill="#5E5B70">blocks, recently seen</text>
<rect x="500" y="80" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="524" y="147.24" font-size="32" font-weight="600" fill="#14121C">Candidates</text>
<text x="524" y="195.24" font-size="26" fill="#5E5B70">7 generators in one</text>
<text x="524" y="233.24" font-size="26" fill="#5E5B70">SQL statement</text>
<rect x="960" y="80" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="984" y="147.24" font-size="32" font-weight="600" fill="#14121C">12 features</text>
<text x="984" y="195.24" font-size="26" fill="#5E5B70">each in [0, 1]: genre</text>
<text x="984" y="233.24" font-size="26" fill="#5E5B70">similarity, recency…</text>
<rect x="1420" y="80" width="410" height="190" rx="16" fill="#EDE5FD" stroke="#6D28D9" stroke-width="4"/>
<text x="1444" y="147.24" font-size="32" font-weight="600" fill="#14121C">Score</text>
<text x="1444" y="195.24" font-size="26" fill="#5E5B70" font-family="&#x27;Ubuntu Sans Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, monospace">σ(bias + Σ wᵢ·fᵢ)</text>
<text x="1444" y="233.24" font-size="26" fill="#5E5B70">a contribution per feature</text>
<rect x="40" y="400" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="64" y="467.24" font-size="32" font-weight="600" fill="#14121C">served_item log</text>
<text x="64" y="515.24" font-size="26" fill="#5E5B70">features as served,</text>
<text x="64" y="553.24" font-size="26" fill="#5E5B70">position, exploration</text>
<rect x="500" y="400" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="524" y="467.24" font-size="32" font-weight="600" fill="#14121C">Session</text>
<text x="524" y="515.24" font-size="26" fill="#5E5B70">200 items, cut into</text>
<text x="524" y="553.24" font-size="26" fill="#5E5B70">pages of 10</text>
<rect x="960" y="400" width="410" height="190" rx="16" fill="#EDE5FD" stroke="#6D28D9" stroke-width="4"/>
<text x="984" y="467.24" font-size="32" font-weight="600" fill="#14121C">Explore</text>
<text x="984" y="515.24" font-size="26" fill="#5E5B70">10 % of the slots from</text>
<text x="984" y="553.24" font-size="26" fill="#5E5B70">the 4th: fresh posts</text>
<rect x="1420" y="400" width="410" height="190" rx="16" fill="#EDE5FD" stroke="#6D28D9" stroke-width="4"/>
<text x="1444" y="467.24" font-size="32" font-weight="600" fill="#14121C">Diversify (MMR)</text>
<text x="1444" y="515.24" font-size="26" fill="#5E5B70">score vs similarity,</text>
<text x="1444" y="553.24" font-size="26" fill="#5E5B70">≤ 5 posts per author</text>
<rect x="40" y="740" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="64" y="807.24" font-size="32" font-weight="600" fill="#14121C">served_outcome</text>
<text x="64" y="855.24" font-size="26" fill="#5E5B70">one definition of</text>
<text x="64" y="893.24" font-size="26" fill="#5E5B70">“engaged” (a view)</text>
<rect x="500" y="740" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="524" y="807.24" font-size="32" font-weight="600" fill="#14121C">Python lab</text>
<text x="524" y="855.24" font-size="26" fill="#5E5B70">logistic regression</text>
<text x="524" y="893.24" font-size="26" fill="#5E5B70">+ a position prior</text>
<rect x="960" y="740" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="984" y="807.24" font-size="32" font-weight="600" fill="#14121C">DRAFT config</text>
<text x="984" y="855.24" font-size="26" fill="#5E5B70">weights + metrics,</text>
<text x="984" y="893.24" font-size="26" fill="#5E5B70">marked simulated</text>
<rect x="1420" y="740" width="410" height="190" rx="16" fill="#FFFFFF" stroke="#C9C5DD" stroke-width="2.5"/>
<text x="1444" y="807.24" font-size="32" font-weight="600" fill="#14121C">Playground</text>
<text x="1444" y="855.24" font-size="26" fill="#5E5B70">preview, replay,</text>
<text x="1444" y="893.24" font-size="26" fill="#5E5B70">then Activate</text>
<text x="1639" y="344" font-size="26" font-weight="500" fill="#14121C" text-anchor="start" stroke="#F7F6FB" stroke-width="10" stroke-linejoin="round" paint-order="stroke">scored list</text>
<text x="259" y="680" font-size="26" font-weight="500" fill="#14121C" text-anchor="start" stroke="#F7F6FB" stroke-width="10" stroke-linejoin="round" paint-order="stroke">joined with events</text>
<text x="1898" y="505" font-size="26" font-weight="600" fill="#6D28D9" text-anchor="middle" stroke="#F7F6FB" stroke-width="8" stroke-linejoin="round" paint-order="stroke" transform="rotate(-90 1898 505)">Activate: every API instance reloads</text>
<text x="510" y="668" font-size="26" font-weight="400" fill="#14121C" text-anchor="start" stroke="#F7F6FB" stroke-width="8" stroke-linejoin="round" paint-order="stroke">the same σ in Python and Java: 26 parity cases, |Δ| &lt; 1e-6</text>
<text x="40" y="1010" font-size="26" font-weight="600" fill="#6D28D9" text-anchor="start" stroke="#F7F6FB" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Purple: FeedRanker.rank, one pure function for the live feed and the playground&#x27;s preview</text>
