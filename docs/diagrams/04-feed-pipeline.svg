<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="The For You pipeline: user context, candidates from seven SQL generators, twelve features, a logistic score, MMR diversity, exploration, a 200-item session and the served-item log; the loop below reads that log through one label view, trains in Python, publishes a DRAFT config that the playground compares and activates. The purple steps are one pure function shared with the playground&#x27;s preview." font-family="&#x27;Ubuntu Sans&#x27;, &#x27;DejaVu Sans&#x27;, sans-serif">
<title>The feed: ranked once per session, logged as served, learned from offline</title>
