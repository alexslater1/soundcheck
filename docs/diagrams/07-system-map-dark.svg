<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="The whole system on one page: four clients reach CloudFront; CloudFront sends /api to the API service, a Spring Boot modular monolith whose nine modules are drawn inside it, and /media to S3; the API and the transcode workers, the same jar in another role, share S3, SQS and PostgreSQL; ingestion calls six outside services, notifications calls Firebase, and both processes send telemetry to Grafana Cloud." font-family="&#x27;Ubuntu Sans&#x27;, &#x27;DejaVu Sans&#x27;, sans-serif">
