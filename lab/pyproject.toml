[project]
name = "soundcheck-lab"
version = "0.1.0"
description = "Soundcheck ranking lab: simulate, extract, train, evaluate, publish"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "polars>=1.0",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "matplotlib>=3.9",
]

[project.scripts]
soundcheck-lab = "soundcheck_lab.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundcheck_lab"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.mypy.overrides]]
# scikit-learn ships no type hints (train.py); its calls are typed at our boundary instead.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
